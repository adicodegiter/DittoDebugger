openapi: 3.1.0
info:
  title: Ditto AI Chaos Engineering API
  version: 1.0.0
  description: Planned loopback-only control-plane API. No server is implemented yet.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/agents:
    get:
      operationId: getAgentStatus
      responses:
        "200":
          description: Status of the four local specialist agents
  /api/v1/discovery/refresh:
    post:
      operationId: refreshDiscovery
      responses:
        "200":
          description: Read-only discovery and graph refresh
  /api/v1/health:
    get:
      operationId: getWorkbenchHealth
      responses:
        "200":
          description: Workbench and dependency health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/architecture:
    get:
      operationId: getArchitecture
      responses:
        "200":
          description: Provenance-labelled component graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Architecture"
  /api/v1/telemetry:
    get:
      operationId: getTelemetry
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Bounded normalized observations and coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Telemetry"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/experiments/plan:
    post:
      operationId: planExperiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Candidates proposed; no fault was executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/experiments/{experiment_id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      operationId: getExperiment
      responses:
        "200":
          description: Candidate and current approval state
          content:
            application/json:
              schema:
                $ref: "./experiment.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/experiments/{experiment_id}/approval:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: recordApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "201":
          description: Human approval decision recorded; execution has not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/experiments/{experiment_id}/execute:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: executeApprovedExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "503":
          description: Execution is disabled until the isolated Docker runner is implemented and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getExperimentRun
      responses:
        "200":
          description: Run prediction, observations, cleanup, and recovery state
          content:
            application/json:
              schema:
                $ref: "./experiment-run.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/findings:
    get:
      operationId: getFindings
      parameters:
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Findings with evidence and score coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      required: [status, dependencies]
      properties:
        status:
          enum: [ok, degraded]
        dependencies:
          type: object
          additionalProperties:
            enum: [ok, unavailable, not_configured]
    Architecture:
      type: object
      required: [status, graph_version, nodes, edges, clusters, network_zones]
      properties:
        status: { enum: [available, unavailable, partial] }
        graph_version:
          type: string
        nodes:
          type: array
          items:
            $ref: "./service.schema.json"
        edges:
          type: array
          items:
            type: object
            required: [source, target, relation, provenance, confidence]
            properties:
              source: { type: string }
              target: { type: string }
              relation: { type: string }
              provenance: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              evidence_type: { enum: [static, runtime, documented, operator] }
              runtime_observed: { type: boolean }
        clusters:
          type: array
          items:
            type: object
            required: [id, members, source, confidence, complete]
            properties:
              id: { type: string }
              members: { type: array, items: { type: string } }
              source: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              complete: { type: boolean }
        network_zones:
          type: array
          items:
            type: object
            required: [id, members, source, evidence_type]
            properties:
              id: { type: string }
              members: { type: array, items: { type: string } }
              source: { type: string }
              evidence_type: { enum: [static, runtime, documented, operator] }
        warnings: { type: array, items: { type: string } }
    Telemetry:
      type: object
      required: [from, to, observations, coverage]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        observations:
          type: array
          items:
            type: object
            required: [metric, value, observed_at, source]
            properties:
              metric: { type: string }
              value: { type: number }
              observed_at: { type: string, format: date-time }
              source: { type: string }
              labels: { type: object, additionalProperties: { type: string } }
        coverage: { type: number, minimum: 0, maximum: 1 }
    PlanRequest:
      type: object
      additionalProperties: false
      required: [baseline_id, max_candidates]
      properties:
        baseline_id: { type: string, minLength: 1 }
        max_candidates: { type: integer, minimum: 1, maximum: 10 }
    PlanResponse:
      type: object
      required: [plan_id, candidates, policy_rejections]
      properties:
        plan_id: { type: string }
        candidates:
          type: array
          items:
            $ref: "./experiment.schema.json"
        policy_rejections:
          type: array
          items: { type: object }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason, candidate_hash]
      properties:
        decision: { enum: [approve, reject] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        candidate_hash: { type: string, pattern: "^sha256:" }
    ApprovalResponse:
      type: object
      required: [approval_id, decision, expires_at, candidate_hash]
      properties:
        approval_id: { type: string }
        decision: { enum: [approve, reject] }
        expires_at: { type: string, format: date-time }
        candidate_hash: { type: string }
    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [approval_id]
      properties:
        approval_id: { type: string, minLength: 1 }
    ExecuteResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { enum: [approved, running] }
    FindingsResponse:
      type: object
      required: [run_id, findings, score]
      properties:
        run_id: { type: string }
        findings:
          type: array
          items:
            $ref: "./finding.schema.json"
        score:
          type: object
          required: [status, coverage]
          properties:
            status: { enum: [complete, incomplete, unsafe] }
            value: { type: [number, "null"], minimum: 0, maximum: 100 }
            coverage: { type: number, minimum: 0, maximum: 1 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    InvalidRequest:
      description: Request validation or deterministic policy rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Stale approval, invalid state, or active experiment conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Required local dependency or precondition unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested plan, run, or finding set does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"